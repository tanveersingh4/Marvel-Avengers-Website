<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARVEL | RECRUITED</title>
    <link rel="icon" type="image/jpeg" href="Marvel.pics/characters.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars-bg"></div>
    <div class="mesh-bg"></div>

    <div class="success-container">
        <div class="main-title">
            CONGRATULATIONS!
            <span>YOU ARE NOW AN AVENGER</span>
        </div>

        <div class="member-card">
            <div class="card-header-badge">★ S.H.I.E.L.D. OFFICIAL RECRUITMENT IDENTITY ★</div>
            <div class="hero-name-display" id="displayName">UNKNOWN HERO</div>

            <div class="hero-details-row">
                <div class="detail-item">
                    <div class="detail-label">Primary Ability</div>
                    <div class="detail-value" id="displayPower">Super Strength</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Clearance Level</div>
                    <div class="detail-value" id="displayLevel">Level 7 — Classified</div>
                </div>
            </div>

            <a href="index.html" class="assemble-btn">AVENGERS ASSEMBLE — GO TO BASE</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load dynamic hero information from sessionStorage
        const heroAlias = sessionStorage.getItem('marvel_hero_alias') || 'AVENGER RECRUIT';
        const heroPower = sessionStorage.getItem('marvel_hero_power') || 'Super Human Ability';
        const threatLevel = sessionStorage.getItem('marvel_threat_level') || 'Global Guardian';

        document.getElementById('displayName').innerText = heroAlias;
        document.getElementById('displayPower').innerText = heroPower;
        document.getElementById('displayLevel').innerText = threatLevel;

        // Create celebratory floating particles
        const container = document.querySelector('.success-container');
        for (let i = 0; i < 50; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 3 + 's';
            particle.style.animationDuration = (2 + Math.random() * 2.5) + 's';
            particle.style.background = Math.random() > 0.5 ? 'var(--m-red)' : 'var(--m-gold)';
            container.appendChild(particle);
        }
    </script>
</body>
</html>
