<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARVEL | HEROES</title>
    <link rel="icon" type="image/jpeg" href="Marvel.pics/characters.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Exo+2:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="vignette"></div>
    <div class="stars-bg"></div>
    <div class="mesh-bg"></div>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top custom-navbar">
        <div class="container-fluid px-lg-5">
            <a href="index.html" class="navbar-brand logo">MAR<span>VEL</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#marvelNavbar"
                aria-controls="marvelNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="marvelNavbar">
                <ul class="navbar-nav">
                    <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="marvel_heroes.html" class="nav-link active">Heroes</a></li>
                    <li class="nav-item"><a href="marvel_database.html" class="nav-link">Database</a></li>
                    <li class="nav-item"><a href="marvel_history.html" class="nav-link">History</a></li>
                    <li class="nav-item"><a href="marvel_missions.html" class="nav-link">Missions</a></li>
                    <li class="nav-item"><a href="marvel_villains.html" class="nav-link">Villains</a></li>
                    <li class="nav-item"><a href="marvel_join.html" class="nav-link">Recruitment</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="container py-4">
        <div class="section-header reveal">
            <p>Hero Archive</p>
            <h2>The Roster</h2>
        </div>

        <div class="gallery-container">
            <div class="row g-4" id="galleryGrid"></div>
        </div>
    </section>

    <footer>
        <div class="footer-logo">MARVEL</div>
        <p class="copyright">© 2026 Stark Industries. All rights reserved.</p>
        <p class="creator">Created by Tanveer Singh</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const heroes = [
            { name: "Iron Man", alias: "Tony Stark", img: "ironman-removebg-preview.png" },
            { name: "Captain America", alias: "Steve Rogers", img: "captain.png" },
            { name: "Thor", alias: "God of Thunder", img: "thor-removebg-preview.png" },
            { name: "Hulk", alias: "Bruce Banner", img: "hulk-removebg-preview.png" },
            { name: "Black Widow", alias: "Natasha Romanoff", img: "blackwidow.png" },
            { name: "Star-Lord", alias: "Peter Quill", img: "peter-removebg-preview.png" },
            { name: "Spider-Man", alias: "Peter Parker", img: "spider-removebg-preview.png" },
            { name: "Doctor Strange", alias: "Stephen Strange", img: "strange-removebg-preview.png" },
            { name: "Black Panther", alias: "T'Challa", img: "panther-removebg-preview.png" },
            { name: "Ant-Man", alias: "Scott Lang", img: "antman.png" },
            { name: "Captain Marvel", alias: "Carol Danvers", img: "captain_marvel-removebg-preview.png" },
            { name: "Scarlet Witch", alias: "Wanda Maximoff", img: "wanda-removebg-preview.png" },
            { name: "Vision", alias: "Synthezoid", img: "vision-removebg-preview.png" },
            { name: "Hawkeye", alias: "Clint Barton", img: "hawkeye-removebg-preview.png" },
            { name: "Falcon", alias: "Sam Wilson", img: "falcon-removebg-preview.png" },
            { name: "Winter Soldier", alias: "Bucky Barnes", img: "wintersoldier-removebg-preview.png" },
            { name: "War Machine", alias: "James Rhodes", img: "war_machine-removebg-preview.png" },
            { name: "Valkyrie", alias: "Brunnhilde", img: "Valkyrie-removebg-preview.png" },
            { name: "Groot", alias: "I am Groot", img: "groot-removebg-preview.png" },
            { name: "Rocket", alias: "Subject 89P13", img: "rocket-removebg-preview.png" },
            { name: "Gamora", alias: "Deadliest Woman", img: "ghamora-removebg-preview.png" },
            { name: "Drax", alias: "The Destroyer", img: "drax-removebg-preview.png" },
            { name: "Nebula", alias: "Cyborg Assassin", img: "nebula-removebg-preview.png" },
            { name: "Mantis", alias: "Empath", img: "mantris-removebg-preview.png" }
        ];

        const grid = document.getElementById('galleryGrid');
        heroes.forEach((hero, index) => {
            const col = document.createElement('div');
            col.className = 'col-12 col-sm-6 col-md-4 col-lg-3';
            col.innerHTML = `
                <div class="gallery-item reveal" style="transition-delay: ${(index % 4) * 0.1}s">
                    <img src="Marvel.pics/${hero.img}" alt="${hero.name}" loading="lazy">
                    <div class="item-info">
                        <span>${hero.alias}</span>
                        <h3>${hero.name}</h3>
                    </div>
                </div>
            `;
            grid.appendChild(col);
        });

        const reveals = document.querySelectorAll('.reveal');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('active');
            });
        }, { threshold: 0.1 });
        reveals.forEach(el => observer.observe(el));
    </script>
</body>

</html>
